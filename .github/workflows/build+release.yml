name: Build & Release Windows App

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release Tag (e.g., v1.0.0). Leave empty for build-only artifact.'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Portable Windows Executable
        run: pnpm dist:portable

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FSO-Roster-Manager-Portable
          path: dist/*.exe
          retention-days: 14

      - name: Publish to GitHub Releases
        if: ${{ github.event.inputs.release_version != '' || startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_version || github.ref_name }}
          name: ${{ github.event.inputs.release_version || github.ref_name }}
          files: dist/*.exe
          generate_release_notes: true
