name: Build & Release Windows App

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*' # Triggers whenever you push a tag like v1.0.0, v1.0.1

permissions:
  contents: write # Grants permission to create GitHub Releases and upload assets

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Portable Windows Executable
        run: pnpm dist:portable

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
